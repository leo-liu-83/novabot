<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="brand">
      <div class="brand-row">
        <span class="brand-mark">NOVA<em>BOT</em></span>
        <span class="brand-mini" aria-hidden="true">N</span>
        <button class="rail-collapse" id="rail-collapse" type="button"
                aria-controls="rail" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron"></use></svg>
        </button>
      </div>
      <div class="brand-sub" id="brand-sub">CONTROL CONSOLE</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="identity" id="identity" type="button">
      <span class="identity-avatar" id="identity-avatar">L</span>
      <span class="identity-meta">
        <span class="identity-name" id="identity-name">leo</span>
        <span class="identity-role" id="identity-role">单用户机主</span>
      </span>
      <span class="identity-caret" aria-hidden="true">▾</span>
    </button>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="stage">
    <header class="topbar" id="topbar">
      <button class="icon-btn rail-toggle" id="rail-toggle" type="button" aria-label="打开导航">
        <svg class="icon"><use href="#i-menu"></use></svg>
      </button>
      <div class="topbar-title">
        <span class="kicker" id="page-kicker">工作台 / 会话</span>
        <h1 id="page-title">会话</h1>
      </div>
      <div class="topbar-tools" id="topbar-tools"></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
